<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Aisles — Shared Grocery List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FAFAF6;
    --paper-line: #E4E1D6;
    --ink: #1B3A2B;
    --ink-soft: #4B5C50;
    --green: #2F6B4F;
    --green-dark: #1B3A2B;
    --rust: #B8541D;
    --rust-dark: #8F3F14;
    --check: #D9D4C2;
    --card: #FFFFFF;
    --shadow: 0 1px 2px rgba(27,58,43,0.06), 0 1px 1px rgba(27,58,43,0.04);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:'Space Grotesk', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body{
    padding-bottom: 96px;
    min-height:100vh;
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 42px;
    background-attachment: local;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    border-bottom:2px solid var(--ink);
    padding:18px 18px 14px;
  }
  .brand{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:10px;
  }
  .brand h1{
    font-family:'Fraunces', serif;
    font-weight:700; font-size:28px; letter-spacing:-0.01em;
    margin:0; color:var(--green-dark);
  }
  .brand h1 span{ color: var(--rust); }
  .count-pill{
    font-size:13px; font-weight:600; color:var(--ink-soft);
    white-space:nowrap;
  }
  .share-row{
    margin-top:10px; display:flex; align-items:center; gap:8px;
  }
  .share-row button{
    font-family:'Space Grotesk', sans-serif;
    font-size:13px; font-weight:600; color:var(--green-dark);
    background:var(--card); border:1.5px solid var(--paper-line);
    border-radius:8px; padding:7px 12px; cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  .share-row button:active{ background:var(--check); }
  .share-code{
    font-family:'Space Grotesk', sans-serif; font-weight:700;
    letter-spacing:0.06em; font-size:13px; color:var(--ink-soft);
  }
  main{ padding: 4px 14px 20px; max-width:640px; margin:0 auto; }

  .add-form{
    display:flex; gap:8px; margin:16px 0 22px;
    position:sticky; top:88px; z-index:15;
  }
  .add-form input[type="text"]{
    flex:1; font-family:'Space Grotesk', sans-serif; font-size:16px;
    padding:12px 14px; border-radius:10px; border:1.5px solid var(--paper-line);
    background:var(--card); color:var(--ink); box-shadow:var(--shadow);
  }
  .add-form input[type="text"]:focus{ outline:2px solid var(--green); outline-offset:1px; }
  .add-form select{
    font-family:'Space Grotesk', sans-serif; font-size:14px; font-weight:600;
    padding:0 10px; border-radius:10px; border:1.5px solid var(--paper-line);
    background:var(--card); color:var(--ink-soft); max-width:118px;
  }
  .add-form button{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:20px;
    width:46px; border-radius:10px; border:none; background:var(--green-dark);
    color:#fff; cursor:pointer; box-shadow:var(--shadow);
  }
  .add-form button:active{ background:var(--green); }

  .guess-row{
    display:none; align-items:center; gap:8px; margin:-14px 0 20px; padding:0 2px;
  }
  .guess-chip{
    font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:600;
    color:var(--green-dark); background:var(--card); border:1.5px solid var(--green);
    border-radius:999px; padding:6px 12px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
  }
  .guess-chip .hint{ color:var(--ink-soft); font-weight:500; }
  .guess-row select{
    flex:1; font-family:'Space Grotesk', sans-serif; font-size:14px; font-weight:600;
    padding:9px 12px; border-radius:10px; border:1.5px solid var(--rust);
    background:#FBEEE4; color:var(--ink);
  }

  section.category{ margin-bottom:26px; }
  .cat-head{
    display:flex; align-items:center; gap:9px; margin-bottom:8px;
    padding-bottom:6px; border-bottom:1.5px solid var(--ink);
  }
  .cat-head .icon{ font-size:18px; line-height:1; }
  .cat-head h2{
    font-family:'Fraunces', serif; font-weight:600; font-size:18px;
    margin:0; color:var(--green-dark);
  }
  .cat-head .cat-count{
    margin-left:auto; font-size:12px; color:var(--ink-soft); font-weight:600;
  }

  ul.items{ list-style:none; margin:0; padding:0; }
  li.item{
    display:flex; align-items:center; gap:12px;
    padding:11px 4px; border-bottom:1px solid var(--paper-line);
  }
  li.item:last-child{ border-bottom:none; }
  .radial{
    flex:0 0 auto; width:24px; height:24px; border-radius:50%;
    border:2px solid var(--green); background:transparent;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .radial.checked{ background:var(--green); }
  .radial.checked::after{
    content:''; width:10px; height:10px; border-radius:50%; background:#fff;
  }
  .item-name{
    flex:1; font-size:16px; color:var(--ink); word-break:break-word;
    transition: color .15s, opacity .15s;
  }
  li.item.checked .item-name{
    color:var(--ink-soft); text-decoration:line-through; opacity:0.6;
  }
  .item-del{
    flex:0 0 auto; width:28px; height:28px; border:none; background:none;
    color:var(--paper-line); font-size:18px; cursor:pointer;
  }
  li.item:hover .item-del, li.item:active .item-del{ color:var(--ink-soft); }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty-state .big{ font-size:38px; margin-bottom:10px; }
  .empty-state h3{
    font-family:'Fraunces', serif; font-size:20px; color:var(--green-dark); margin:0 0 6px;
  }
  .empty-state p{ font-size:14px; margin:0; }

  .finish-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--paper) 60%, transparent);
  }
  .finish-bar .inner{
    max-width:640px; margin:0 auto;
    display:flex; align-items:center; gap:10px;
  }
  .finish-btn{
    flex:1; font-family:'Fraunces', serif; font-weight:600; font-size:17px;
    padding:14px; border-radius:12px; border:none; cursor:pointer;
    background:var(--rust); color:#fff; box-shadow: 0 4px 14px rgba(184,84,29,0.35);
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .finish-btn:disabled{
    background:var(--check); color:var(--ink-soft); box-shadow:none; cursor:default;
  }
  .finish-btn:active:not(:disabled){ background:var(--rust-dark); }

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(20px);
    background:var(--green-dark); color:#fff; font-size:14px; font-weight:600;
    padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none;
    transition: opacity .2s, transform .2s; z-index:40; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .banner{
    max-width:640px; margin:0 auto 16px; padding:12px 14px; border-radius:10px;
    background:#EFEBD8; border:1.5px solid var(--paper-line); font-size:13px;
    color:var(--ink-soft); line-height:1.5;
  }
  .banner code{ background:#fff; padding:2px 5px; border-radius:5px; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Aisles<span>.</span></h1>
    <div class="count-pill" id="countPill">0 items</div>
  </div>
  <div class="share-row">
    <button id="shareBtn">🔗 Share this list</button>
    <span class="share-code" id="codeLabel"></span>
  </div>
</header>

<main>
  <div id="setupBanner" class="banner" style="display:none;">
    This app needs a Firebase project connected before it can save or sync anything.
    See <code>SETUP.md</code> for the 5-minute setup, then edit the config at the
    top of <code>index.html</code>.
  </div>

  <form class="add-form" id="addForm">
    <input type="text" id="itemInput" placeholder="Add an item…" autocomplete="off" />
    <button type="submit" aria-label="Add item">+</button>
  </form>
  <div class="guess-row" id="guessRow">
    <button type="button" class="guess-chip" id="guessChip"></button>
    <select id="categorySelect"></select>
  </div>

  <div id="listRoot"></div>
</main>

<div class="finish-bar">
  <div class="inner">
    <button class="finish-btn" id="finishBtn" disabled>✓ Finish Shopping — Clear Checked</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
    onSnapshot, query, orderBy, writeBatch, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ---------------------------------------------------------------------
  // 1. FIREBASE CONFIG — replace with the values from your Firebase
  //    project settings (see SETUP.md). The app won't sync until this
  //    is filled in.
  // ---------------------------------------------------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyArDBKW5qdUVs-NsYbtplVqkTW49HOvw5w",
    authDomain: "aisles-f3a4c.firebaseapp.com",
    projectId: "aisles-f3a4c",
    storageBucket: "aisles-f3a4c.firebasestorage.app",
    messagingSenderId: "814799394672",
    appId: "1:814799394672:web:772878c89587f2fd0be1b5"
  };

  // ---------------------------------------------------------------------
  // 2. CATEGORIES — order here is the order they'll appear on the list.
  //    Add, remove, or reorder freely; "key" just needs to stay unique.
  // ---------------------------------------------------------------------
  const CATEGORIES = [
    { key: 'produce', label: 'Produce',                 icon: '🥬' },
    { key: 'meat',    label: 'Meat',                    icon: '🥩' },
    { key: 'cheese',  label: 'Cheese',                  icon: '🧀' },
    { key: 'canned',  label: 'Canned',                  icon: '🥫' },
    { key: 'chips',   label: 'Chips',                   icon: '🍿' },
    { key: 'bread',   label: 'Bread',                   icon: '🍞' },
    { key: 'frozen',  label: 'Frozen',                  icon: '🧊' },
    { key: 'dairy',   label: 'Dairy',                   icon: '🥛' },
    { key: 'misc',    label: 'Misc / Spices / Baking',  icon: '🧂' },
    { key: 'drinks',  label: 'Drinks / Juice',          icon: '🥤' },
    { key: 'alcohol', label: 'Alcohol',                 icon: '🍷' },
    { key: 'pharmacy',label: 'Pharmacy',                icon: '💊' },
    { key: 'baby',    label: 'Baby',                    icon: '🍼' },
    { key: 'target',  label: 'Target',                  icon: '🎯' },
    { key: 'costco',  label: 'Costco',                  icon: '🛒' },
  ];

  // ---------------------------------------------------------------------
  // 3. AUTO-DETECT KEYWORDS — used to guess an item's category as you
  //    type. Add more keywords any time; first match wins. "target" and
  //    "costco" are left out on purpose — those are about where you buy
  //    something, not what it is, so they always need a manual pick.
  // ---------------------------------------------------------------------
  const CATEGORY_KEYWORDS = {
    produce: ['broccoli','lettuce','spinach','kale','tomato','tomatoes','onion','onions','garlic','potato','potatoes','carrot','carrots','celery','cucumber','pepper','peppers','mushroom','mushrooms','avocado','avocados','lemon','lemons','lime','limes','apple','apples','banana','bananas','orange','oranges','grape','grapes','berry','berries','strawberry','strawberries','blueberry','blueberries','raspberry','melon','watermelon','cantaloupe','cilantro','parsley','basil','herbs','corn','zucchini','squash','cabbage','cauliflower','asparagus','ginger root','scallion','scallions','green onion'],
    meat: ['chicken','beef','pork','steak','bacon','sausage','sausages','turkey','ground beef','ground turkey','ham','salmon','shrimp','fish','tilapia','ribs','chops','brisket','wings','meatballs'],
    cheese: ['cheddar','mozzarella','parmesan','brie','feta','gouda','string cheese','cream cheese','shredded cheese','cheese','provolone','swiss cheese'],
    canned: ['canned','beans','soup','tomato sauce','broth','chickpeas','tuna','corn (canned)','black beans','refried beans','diced tomatoes','tomato paste','condensed milk'],
    chips: ['chips','pretzels','popcorn','tortilla chips','doritos','cheetos','crackers','pita chips'],
    bread: ['bread','bagel','bagels','tortilla','tortillas','bun','buns','roll','rolls','baguette','english muffin','naan','pita'],
    frozen: ['frozen','ice cream','waffles','frozen pizza','frozen fries','popsicle','popsicles','frozen veggies','frozen vegetables','freezer'],
    dairy: ['milk','yogurt','butter','eggs','egg','cream','half and half','sour cream','cottage cheese','almond milk','oat milk'],
    misc: ['sugar','flour','salt','spice','spices','oil','olive oil','baking soda','baking powder','vanilla','ketchup','mustard','mayo','mayonnaise','pasta','rice','cereal','oats','honey','syrup','peanut butter','jelly','jam','seasoning','vinegar','breadcrumbs'],
    drinks: ['juice','soda','coffee','tea','water','gatorade','energy drink','lemonade','sparkling water','kombucha'],
    alcohol: ['beer','wine','vodka','whiskey','tequila','rum','gin','seltzer','hard seltzer','liquor','champagne'],
    pharmacy: ['tylenol','advil','ibuprofen','aspirin','vitamins','vitamin','bandaids','band-aids','medicine','cough','allergy','sunscreen','toothpaste','floss','deodorant','shampoo'],
    baby: ['diapers','diaper','formula','wipes','baby food','baby wash','pacifier'],
  };

  function guessCategory(name) {
    const lower = name.toLowerCase().trim();
    if (!lower) return null;
    for (const [key, words] of Object.entries(CATEGORY_KEYWORDS)) {
      for (const w of words) {
        if (lower === w || lower.includes(w)) return key;
      }
    }
    return null;
  }

  const isConfigured = !Object.values(firebaseConfig).some(v => String(v).startsWith('YOUR_'));
  document.getElementById('setupBanner').style.display = isConfigured ? 'none' : 'block';

  // ---------------------------------------------------------------------
  // List identity — no login. The list ID lives in the URL (?list=CODE)
  // and is remembered on this device so you don't have to re-share it
  // every time you open the app yourself.
  // ---------------------------------------------------------------------
  function generateCode(len = 6) {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let out = '';
    for (let i = 0; i < len; i++) out += chars[Math.floor(Math.random() * chars.length)];
    return out;
  }

  function getListId() {
    const params = new URLSearchParams(location.search);
    let id = params.get('list');
    if (!id) id = localStorage.getItem('aisle_list_id');
    if (!id) id = generateCode();
    localStorage.setItem('aisle_list_id', id);
    const url = new URL(location.href);
    url.searchParams.set('list', id);
    history.replaceState({}, '', url);
    return id;
  }

  const listId = getListId();
  document.getElementById('codeLabel').textContent = `List: ${listId}`;

  const categorySelect = document.getElementById('categorySelect');
  const placeholderOpt = document.createElement('option');
  placeholderOpt.value = '';
  placeholderOpt.textContent = 'Which aisle?';
  categorySelect.appendChild(placeholderOpt);
  CATEGORIES.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.key;
    opt.textContent = `${c.icon} ${c.label}`;
    categorySelect.appendChild(opt);
  });

  const itemInput = document.getElementById('itemInput');
  const guessRow = document.getElementById('guessRow');
  const guessChip = document.getElementById('guessChip');
  let currentGuess = null;
  let manualPick = null;

  function updateGuessUI() {
    const val = itemInput.value.trim();
    if (!val) {
      guessRow.style.display = 'none';
      currentGuess = null;
      manualPick = null;
      return;
    }
    currentGuess = guessCategory(val);
    guessRow.style.display = 'flex';
    if (manualPick) {
      const cat = CATEGORIES.find(c => c.key === manualPick);
      showChip(cat, false);
    } else if (currentGuess) {
      const cat = CATEGORIES.find(c => c.key === currentGuess);
      showChip(cat, true);
    } else {
      guessChip.style.display = 'none';
      categorySelect.style.display = 'block';
      categorySelect.value = '';
    }
  }

  function showChip(cat, isGuess) {
    guessChip.innerHTML = `${cat.icon} ${cat.label} <span class="hint">${isGuess ? '· tap to change' : '· picked'}</span>`;
    guessChip.style.display = 'inline-flex';
    categorySelect.style.display = 'none';
  }

  itemInput.addEventListener('input', () => {
    manualPick = null;
    updateGuessUI();
  });

  guessChip.addEventListener('click', () => {
    guessChip.style.display = 'none';
    categorySelect.style.display = 'block';
    categorySelect.value = manualPick || currentGuess || '';
    categorySelect.focus();
  });

  categorySelect.addEventListener('change', () => {
    if (categorySelect.value) {
      manualPick = categorySelect.value;
      updateGuessUI();
    }
  });

  const listRoot = document.getElementById('listRoot');
  const countPill = document.getElementById('countPill');
  const finishBtn = document.getElementById('finishBtn');
  const toast = document.getElementById('toast');

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  document.getElementById('shareBtn').addEventListener('click', async () => {
    const url = location.href;
    try {
      await navigator.clipboard.writeText(url);
      showToast('Link copied — send it to your fiancée');
    } catch {
      showToast(`Share this link: ${url}`);
    }
  });

  let app, db;
  if (isConfigured) {
    app = initializeApp(firebaseConfig);
    db = getFirestore(app);

    const itemsCol = collection(db, 'lists', listId, 'items');
    const itemsQuery = query(itemsCol, orderBy('addedAt', 'asc'));

    onSnapshot(itemsQuery, (snap) => {
      const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render(items);
    }, (err) => {
      console.error(err);
      showToast('Sync error — check your Firebase setup');
    });

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = itemInput.value.trim();
      if (!name) return;

      const category = manualPick || currentGuess;
      if (!category) {
        guessRow.style.display = 'flex';
        guessChip.style.display = 'none';
        categorySelect.style.display = 'block';
        categorySelect.focus();
        showToast("Not sure which aisle — pick one");
        return;
      }

      itemInput.value = '';
      guessRow.style.display = 'none';
      currentGuess = null;
      manualPick = null;

      await addDoc(itemsCol, {
        name,
        category,
        checked: false,
        addedAt: serverTimestamp()
      });
    });

    finishBtn.addEventListener('click', async () => {
      const checkedIds = window.__aisleCheckedIds || [];
      if (!checkedIds.length) return;
      const batch = writeBatch(db);
      checkedIds.forEach(id => batch.delete(doc(db, 'lists', listId, 'items', id)));
      await batch.commit();
      showToast(`Cleared ${checkedIds.length} item${checkedIds.length > 1 ? 's' : ''} — happy shopping next time`);
    });

    window.__toggleItem = async (id, current) => {
      await updateDoc(doc(db, 'lists', listId, 'items', id), { checked: !current });
    };
    window.__deleteItem = async (id) => {
      await deleteDoc(doc(db, 'lists', listId, 'items', id));
    };
  } else {
    render([]);
  }

  function render(items) {
    const total = items.length;
    const checkedCount = items.filter(i => i.checked).length;
    countPill.textContent = total === 0 ? 'no items' : `${total - checkedCount} left of ${total}`;

    finishBtn.disabled = checkedCount === 0;
    finishBtn.textContent = checkedCount > 0
      ? `✓ Finish Shopping — Clear ${checkedCount} Checked`
      : '✓ Finish Shopping — Clear Checked';
    window.__aisleCheckedIds = items.filter(i => i.checked).map(i => i.id);

    listRoot.innerHTML = '';

    if (!isConfigured) {
      listRoot.innerHTML = `
        <div class="empty-state">
          <div class="big">🧾</div>
          <h3>Not connected yet</h3>
          <p>Add your Firebase config at the top of index.html to start adding items.</p>
        </div>`;
      return;
    }

    if (total === 0) {
      listRoot.innerHTML = `
        <div class="empty-state">
          <div class="big">🛒</div>
          <h3>List's empty</h3>
          <p>Add your first item above — it'll sort itself into the right aisle.</p>
        </div>`;
      return;
    }

    CATEGORIES.forEach(cat => {
      const catItems = items
        .filter(i => i.category === cat.key)
        .sort((a, b) => (a.checked === b.checked) ? 0 : (a.checked ? 1 : -1));
      if (catItems.length === 0) return;

      const section = document.createElement('section');
      section.className = 'category';
      section.innerHTML = `
        <div class="cat-head">
          <span class="icon">${cat.icon}</span>
          <h2>${cat.label}</h2>
          <span class="cat-count">${catItems.filter(i => !i.checked).length}</span>
        </div>
        <ul class="items"></ul>`;
      const ul = section.querySelector('ul');

      catItems.forEach(item => {
        const li = document.createElement('li');
        li.className = 'item' + (item.checked ? ' checked' : '');
        li.innerHTML = `
          <button class="radial ${item.checked ? 'checked' : ''}" aria-label="Toggle ${item.name}"></button>
          <span class="item-name">${escapeHtml(item.name)}</span>
          <button class="item-del" aria-label="Remove ${item.name}">✕</button>`;
        li.querySelector('.radial').addEventListener('click', () => window.__toggleItem(item.id, item.checked));
        li.querySelector('.item-name').addEventListener('click', () => window.__toggleItem(item.id, item.checked));
        li.querySelector('.item-del').addEventListener('click', () => window.__deleteItem(item.id));
        ul.appendChild(li);
      });

      listRoot.appendChild(section);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
